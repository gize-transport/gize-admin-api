# Local development and test services. Ports bind to 127.0.0.1 only.
# Postgres major version matches the Supabase project (17). Update both together.
# Debian (glibc) image, not Alpine (musl), so text collation matches Supabase.
# The default password is for this local, loopback-only container and nothing else.
name: gize-admin-api

services:
  postgres:
    image: postgres:17-trixie@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe  # 17.11, glibc
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gize-local-only}
      POSTGRES_DB: gize
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gize"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Tests get their own server: roles are server-wide, so a test run never changes the
  # passwords or grants of the development roles above. Data lives in memory only.
  postgres-test:
    image: postgres:17-trixie@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe  # 17.11, glibc
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-gize-test-only}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine@sha256:6ba19c50b56777f5c11c58eff8ddb69d0d5f27ba131cffb63f180ccfd43c66af  # 7.4.12
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
