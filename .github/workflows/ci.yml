# Runs on every pull request and every push to main. All six checks must be present and
# green before a PR is merged (CLAUDE.md, "Merging without branch protection"); the list is
# pinned in tests/test_ci_config.py and README.md.
# Third-party actions are pinned to commit SHAs; the comment names the release.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]  # the contract job reads labels
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR runs replace each other; every push to main gets its own run.
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tests run on the image's exact Python patch release (Dockerfile PYTHON_IMAGE tag).
  UV_PYTHON: "3.12.16"
  # Keep in step with the Dockerfile uv image and pyproject's required-version.
  UV_VERSION: "0.11.30"
  # Keep in step with the gitleaks hook rev in .pre-commit-config.yaml.
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  # Keep in step with contract-release.yml (checked by tests/test_ci_config.py).
  OASDIFF_VERSION: "1.33.0"
  OASDIFF_SHA256: "43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint, types, dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.UV_PYTHON }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install (fails if uv.lock is out of date with pyproject.toml)
        run: uv sync --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: pre-commit run --all-files
        # The gitleaks hook only scans staged changes; the secrets job scans history.
        env:
          SKIP: gitleaks
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure
      - name: pip-audit, every locked dependency group
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt \
            | uv run --locked pip-audit --strict --disable-pip --require-hashes -r /dev/stdin

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned release, SHA-256 verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --max-time 60 --output "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/${tarball}" --directory "${RUNNER_TEMP}" gitleaks
      - name: Scan every commit reachable from this run's HEAD
        # HEAD is the PR merge commit (or the pushed main commit). Scanning only its history
        # keeps other branches from failing this run.
        run: '"${RUNNER_TEMP}/gitleaks" git --log-opts="--full-history HEAD" --redact --verbose --exit-code 1 .'

  test:
    name: Tests and coverage gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # Same images as docker-compose.yml (checked by tests/test_ci_config.py).
      postgres:
        image: postgres:17-trixie@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: gize-ci-only
          POSTGRES_DB: gize
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gize"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4-alpine@sha256:6ba19c50b56777f5c11c58eff8ddb69d0d5f27ba131cffb63f180ccfd43c66af
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.UV_PYTHON }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install (fails if uv.lock is out of date with pyproject.toml)
        run: uv sync --locked
      - name: Tests (coverage gate 85%)
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
          TEST_ADMIN_DATABASE_URL: postgresql://postgres:gize-ci-only@127.0.0.1:5432/postgres
        run: uv run --locked pytest
      - name: Services coverage gate (90%)
        run: uv run --locked python -m scripts.check_service_coverage
      - name: Coverage equals .coverage-baseline (must not drop)
        run: uv run --locked python -m scripts.check_coverage_baseline

  migrations:
    name: Migrations (upgrade, downgrade, upgrade)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      # Same image as docker-compose.yml (checked by tests/test_ci_config.py).
      postgres:
        image: postgres:17-trixie@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: gize-ci-only
          POSTGRES_DB: gize
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gize"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      APP_ENV: test
      # Throwaway credentials for the CI service container only. As on Supabase, the
      # bootstrap admin is not a superuser: it has CREATEROLE and owns the database.
      BOOTSTRAP_ADMIN_DATABASE_URL: postgresql://supa_admin:gize-ci-admin@127.0.0.1:5432/gize
      DATABASE_URL: postgresql://gize_app:gize-ci-app@127.0.0.1:5432/gize
      MIGRATOR_DATABASE_URL: postgresql://gize_migrator:gize-ci-migrator@127.0.0.1:5432/gize
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.UV_PYTHON }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install (fails if uv.lock is out of date with pyproject.toml)
        run: uv sync --locked
      - name: Make the server look like Supabase (API roles, a non-superuser admin)
        env:
          PGPASSWORD: gize-ci-only
        run: |
          psql --host 127.0.0.1 --username postgres --dbname gize --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE ROLE supa_admin LOGIN CREATEROLE NOSUPERUSER PASSWORD 'gize-ci-admin';
          ALTER DATABASE gize OWNER TO supa_admin;
          SQL
      - name: Bootstrap roles and schema as that admin
        run: uv run --locked python -m gize_api.core.bootstrap
      - name: Bootstrap again (re-runs must succeed and change nothing)
        run: uv run --locked python -m gize_api.core.bootstrap
      - name: Upgrade to head
        run: uv run --locked alembic upgrade head
      - name: Downgrade one step
        run: uv run --locked alembic downgrade -1
      - name: Upgrade to head again
        run: uv run --locked alembic upgrade head
      - name: Models match migrations (no pending autogenerate changes)
        run: uv run --locked alembic check

  docker:
    name: Docker image build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build --tag gize-admin-api:ci .
      - name: Runs as the unprivileged user
        run: test "$(docker run --rm --entrypoint id gize-admin-api:ci -u)" = "10001"
      - name: Package imports inside the image
        run: docker run --rm --entrypoint python gize-admin-api:ci -c "import gize_api.main"
      - name: Migrations ship in the image
        run: docker run --rm --entrypoint alembic gize-admin-api:ci heads
      - name: The app user can read the database CA, and not change it
        run: |
          docker run --rm --entrypoint sh gize-admin-api:ci -c \
            'test -r /app/certs/supabase-root-2021-ca.crt && ! test -w /app/certs/supabase-root-2021-ca.crt && ! test -w /app/certs'
          docker run --rm --entrypoint python gize-admin-api:ci -c \
            "from pathlib import Path; assert Path('/app/certs/supabase-root-2021-ca.crt').is_file()"

  contract:
    name: API contract (up to date, no breaking changes)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the base branch's openapi.json
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.UV_PYTHON }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install (fails if uv.lock is out of date with pyproject.toml)
        run: uv sync --locked
      - name: openapi.json matches the code
        run: uv run --locked python scripts/export_openapi.py --check
      - name: Install oasdiff (pinned release, SHA-256 verified)
        run: |
          tarball="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --max-time 60 --output "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/${tarball}"
          echo "${OASDIFF_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/${tarball}" --directory "${RUNNER_TEMP}" oasdiff
      - name: The gate catches breaking changes and allows additive ones (self-test)
        # On /v1/staff/me. oasdiff exits 1 for a breaking change and >1 for its own errors,
        # so only 1 counts as "caught". .github/oasdiff-levels.txt: see README, "API contract".
        run: |
          oasdiff() { "${RUNNER_TEMP}/oasdiff" breaking --fail-on WARN --severity-levels .github/oasdiff-levels.txt openapi.json "$1"; }
          jq 'del(.components.schemas.StaffMe.properties.email)
              | .components.schemas.StaffMe.required -= ["email"]' openapi.json > "${RUNNER_TEMP}/removed.json"
          jq '.paths["/v1/staff/me"].get.parameters = [{"name": "since", "in": "query", "required": true, "schema": {"type": "string"}}]' \
            openapi.json > "${RUNNER_TEMP}/required.json"
          jq '.components.schemas.StaffMe.properties.nickname = {"type": "string"}
              | .components.schemas.ErrorCode.enum += ["SOMETHING_NEW"]
              | .components.schemas.StaffRole.enum += ["auditor"]
              | .paths["/v1/staff/new"] = .paths["/v1/staff/me"]
              | .paths["/v1/staff/new"].get.operationId = "staff_new"' openapi.json > "${RUNNER_TEMP}/added.json"
          for breaking in removed required; do
            rc=0; oasdiff "${RUNNER_TEMP}/${breaking}.json" || rc=$?
            if [ "${rc}" -ne 1 ]; then
              echo "::error::the gate did not catch the ${breaking} change (exit ${rc})"
              exit 1
            fi
          done
          oasdiff "${RUNNER_TEMP}/added.json"
          # Error codes, which oasdiff cannot see: a removal must fail, an addition pass.
          jq '.components.schemas.ErrorCode.enum -= ["FORBIDDEN"]' openapi.json > "${RUNNER_TEMP}/code-removed.json"
          rc=0; uv run --locked python -m scripts.contract_codes openapi.json "${RUNNER_TEMP}/code-removed.json" || rc=$?
          if [ "${rc}" -ne 1 ]; then
            echo "::error::the error-code check did not catch a removed code (exit ${rc})"
            exit 1
          fi
          uv run --locked python -m scripts.contract_codes openapi.json "${RUNNER_TEMP}/added.json"
      - name: No breaking changes against the PR's base
        if: github.event_name == 'pull_request'
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change-approved') }}
        # HEAD is the merge commit; its first parent is exactly the base it was built on
        # (origin/<base> may have moved since, e.g. on "Re-run jobs").
        run: |
          if ! git rev-parse --verify --quiet HEAD^2 > /dev/null; then
            echo "::error::expected the PR's merge commit as HEAD (first parent = base)"
            exit 1
          fi
          if [ -z "$(git ls-tree --name-only HEAD^1 -- openapi.json)" ]; then
            echo "The base has no openapi.json yet (the PR that introduces it): nothing to compare."
            exit 0
          fi
          git show HEAD^1:openapi.json > "${RUNNER_TEMP}/base.json"
          rc=0
          "${RUNNER_TEMP}/oasdiff" breaking --fail-on WARN --severity-levels .github/oasdiff-levels.txt \
            "${RUNNER_TEMP}/base.json" openapi.json || rc=$?
          if [ "${rc}" -gt 1 ]; then
            echo "::error::oasdiff failed (exit ${rc})"
            exit 1
          fi
          codes=0
          uv run --locked python -m scripts.contract_codes "${RUNNER_TEMP}/base.json" openapi.json || codes=$?
          if [ "${codes}" -gt 1 ]; then
            echo "::error::the error-code comparison failed (exit ${codes})"
            exit 1
          fi
          if [ "${rc}" -eq 0 ] && [ "${codes}" -eq 0 ]; then
            exit 0
          fi
          if [ "${APPROVED}" = "true" ]; then
            echo "::warning::Breaking API changes, approved with the breaking-change-approved label"
            exit 0
          fi
          echo "::error::Breaking API change. Follow docs/api-contract.md (deprecate first); the owner may approve with the breaking-change-approved label."
          exit 1
