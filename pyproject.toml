[project]
name = "gize-api"
version = "0.1.0"
description = "Gize Transport admin and rider registration API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "opentelemetry-api>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "opentelemetry-instrumentation-asgi>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
    "opentelemetry-sdk>=1.28",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "sentry-sdk>=2.18",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.30",
    "coverage[toml]>=7.6",
    "httpx>=0.28",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11.30,<0.12"

# --- ruff ---------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "S",        # bandit (security)
    "ASYNC",    # async pitfalls
    "DTZ",      # naive datetimes
    "T20",      # print statements
    "SIM",      # simplify
    "PT",       # pytest style
    "ERA",      # commented-out code
    "BLE",      # blind except
    "G",        # logging format strings (keep structlog fields structured)
    "LOG",      # logging misuse
    "ANN401",   # `Any` in signatures; justify with a noqa comment
    "RUF",      # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["gize_api", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
# Assertions are how pytest tests express expectations.
"tests/**" = ["S101"]
# Scripts are command-line tools that report on stdout.
"scripts/**" = ["T201"]

# --- mypy ---------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts", "migrations"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- pytest / coverage --------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "--cov=gize_api",
    "--cov-report=term-missing",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["gize_api"]

[tool.coverage.report]
fail_under = 85
exclude_also = ['if __name__ == "__main__":']
show_missing = true
skip_covered = false
